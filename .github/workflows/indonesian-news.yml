name: Indonesian Trending News

on:
  schedule:
    # Run every 3 hours at Asia/Jakarta time (UTC+7)
    # Cron is in UTC, so we need to adjust
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual triggering for testing

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Fetch and process Indonesian trending news
        env:
          TZ: Asia/Jakarta
        run: |
          python scripts/fetch_indonesian_news.py
          
      - name: Display results
        if: always()
        run: |
          if [ -f news_output.txt ]; then
            cat news_output.txt
          fi
